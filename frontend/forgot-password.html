<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | STAR EMITRA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* =========================================================
           🚀 VIP GLASSMORPHISM THEME - STAR EMITRA
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            /* Deep Space Animated Background */
            background: linear-gradient(-45deg, #0f1326, #1a233a, #0d1b2a, #001233);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🌟 Floating Glass Card */
        .glass-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px; 
            border-radius: 25px; 
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(0, 242, 255, 0.1);
            text-align: center; 
            color: #fff; 
            max-width: 420px; 
            width: 90%; 
            animation: slideUpFade 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUpFade {
            0% { transform: translateY(50px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* 🔒 Animated Lock Icon */
        .lock-icon-container {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 40px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5);
            animation: floatLock 3s ease-in-out infinite;
            border: 3px solid rgba(255,255,255,0.2);
        }

        @keyframes floatLock {
            0%, 100% { transform: translateY(0); box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5); }
            50% { transform: translateY(-15px); box-shadow: 0 20px 35px rgba(0, 242, 255, 0.7); }
        }

        .glass-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .glass-card p {
            color: #b3c5ef;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* ✉️ Glowing Input Field */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00f2ff;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(0, 242, 255, 0.05);
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 🚀 Cyber Button */
        .cyber-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cyber-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.6);
        }

        .cyber-btn:active {
            transform: translateY(1px);
        }

        /* 🔙 Back to Login Link */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link i { margin-right: 5px; }

        .back-link:hover {
            color: #00f2ff;
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
        }

        /* Ambient Glow Behind Card */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,242,255,0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="glass-card">
        <div class="lock-icon-container">
            <i class="fa-solid fa-unlock-keyhole"></i>
        </div>
        <h1>Forgot Password</h1>
        <p>Ghabraye nahi! Apna STAR EMITRA par registered email dalein, hum password reset karne ka VIP link bhejenge.</p>
        
        <form id="forgot-form">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Enter your email address" required autocomplete="off">
            </div>
            
            <button type="submit" id="send-btn" class="cyber-btn">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        
        <a href="index2.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Wapas Login Par Jayein
        </a>
    </div>

    <script>
        // =========================================================
        // 🚀 VIP FORGOT PASSWORD LOGIC
        // =========================================================
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('send-btn');
            const originalBtnText = btn.innerHTML;

            // Loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending Link...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                // 🌟 VIP SweetAlert Popups
                if (res.status === 200) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Email Sent!',
                        text: data.message,
                        background: '#0f1326', color: '#fff', confirmButtonColor: '#00f2ff'
                    });
                    document.getElementById('email').value = ''; // Form clear
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops!',
                        text: data.message,
                        background: '#0f1326', color: '#fff', confirmButtonColor: '#ff4d4d'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Connection Error',
                    text: 'Server se connect nahi ho paye.',
                    background: '#0f1326', color: '#fff', confirmButtonColor: '#ffaa00'
                });
            } finally {
                // Button back to normal
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
