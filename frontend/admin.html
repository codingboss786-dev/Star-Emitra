<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | STAR EMITRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .admin-container { padding: 40px; color: var(--text-primary); max-width: 1200px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--input-bg); }
        th { background: var(--overlay-gradient); color: white; text-transform: uppercase; font-size: 14px; }
        tr:hover { background: rgba(255, 255, 255, 0.05); }
        .status-verified { color: #66f9d7; font-weight: bold; }
        .status-pending { color: #ff4d4d; font-weight: bold; }
        
        .btn-action { padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; margin-right: 5px; color: white; }
        .edit-btn { background: #5c72ef; }
        .delete-btn { background: #ff4d4d; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; }
        .refresh-btn { background: var(--primary-color); color: #000; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .export-btn { background: #28a745; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body class="dark-mode">
    <div class="admin-container">
        <div class="header-flex">
            <h1><i class="fa-solid fa-user-shield"></i> STAR EMITRA Admin</h1>
            <div class="btn-group">
                <button class="export-btn" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                <button class="refresh-btn" onclick="fetchUsers()"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
        </div>
        
        <table id="admin-table">
            <thead>
                <tr>
                    <th>Customer ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>

    <div class="admin-section" style="margin-top: 40px;">
    <h2><i class="fas fa-envelope"></i> Customer Messages</h2>
    <table id="message-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Service</th>
                <th>Message</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="message-table-body"></tbody>
    </table>
</div>

    <script>



        // Admin panel mein page load hone par fetchUsers() ke sath ise bhi call karein: fetchMessages();

async function fetchMessages() {
    try {
        const res = await fetch('/api/admin/messages', { headers: { 'admin-key': validAdminKey } });
        const messages = await res.json();
        const tableBody = document.getElementById('message-table-body');
        tableBody.innerHTML = ''; 

        messages.forEach(msg => {
            const date = new Date(msg.date).toLocaleDateString('en-IN'); // Indian date format
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${date}</td>
                <td><b>${msg.name}</b></td>
                <td><a href="tel:${msg.mobile}" style="color:#00f2ff;">${msg.mobile}</a></td>
                <td><span class="badge" style="background:#444; padding:5px; border-radius:5px;">${msg.service}</span></td>
                <td style="max-width:200px; word-wrap:break-word;">${msg.message}</td>
                <td>
                    <button class="btn-action delete-btn" onclick="deleteMessage('${msg._id}')">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    } catch (err) { console.error("Message load nahi hue", err); }
}

async function deleteMessage(id) {
    const result = await Swal.fire({
        title: 'Delete Message?',
        text: "Kyam aap sach me is message ko delete karna chahte hain?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ff4d4d',
        confirmButtonText: 'Yes, Delete!',
        background: '#0f1326', color: '#fff'
    });

    if (result.isConfirmed) {
        await fetch('/api/admin/messages/' + id, { 
            method: 'DELETE', headers: { 'admin-key': validAdminKey } 
        });
        Swal.fire({icon: 'success', title: 'Deleted!', background: '#0f1326', color: '#fff'});
        fetchMessages(); // Table ko refresh karein
    }
}
        // Memory me key save karenge (Source code me nahi dikhegi)
        let validAdminKey = ""; 

        // 1. SECURITY CHECK (Server se verify karega)
        async function checkAccess() {
            const result = await Swal.fire({
                title: 'Admin Security Check',
                input: 'password',
                inputLabel: 'Secret Key Dalein',
                allowOutsideClick: false,
                background: '#0f1326', // Dark background
                color: '#fff',
                confirmButtonColor: '#00f2ff'
            });

            const enteredKey = result.value;

            try {
                // Backend ko key bhej kar pucho ki sahi hai ya nahi
                const response = await fetch('/api/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: enteredKey })
                });

                const data = await response.json();

                // admin.html ke checkAccess function ke andar ka hissa:
        if (data.success) {
            // Agar server ne haan bola, toh aage badho
            validAdminKey = enteredKey; 
            fetchUsers();
            fetchMessages(); // 🚀 YEH LINE JODNI HAI TAAKI MESSAGE BHI LOAD HON
        } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'Aapne galat key daali hai!',
                        background: '#0f1326', color: '#fff'
                    }).then(() => {
                        window.location.href = 'index2.html'; // Wapas login par bhej do
                    });
                }
            } catch (err) {
                Swal.fire('Server Error', 'Server se connect nahi ho paya.', 'error');
            }
        }

        // 2. DATA LOAD KARNA (Header me secure key bhej kar)
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'admin-key': validAdminKey } // Server ise check karega
                });

                if (!res.ok) throw new Error("Aapko permission nahi hai");
                
                const users = await res.json();
                const tableBody = document.getElementById('user-table-body');
                
                tableBody.innerHTML = ''; 
                
                users.forEach(function(user) {
                    const row = document.createElement('tr');
                    const statusClass = user.isVerified ? 'status-verified' : 'status-pending';
                    const statusText = user.isVerified ? '✅ Verified' : '❌ Pending';

                    row.innerHTML = '<td><b>' + user.customerId + '</b></td>' +
                                  '<td>' + user.name + '</td>' +
                                  '<td>' + user.email + '</td>' +
                                  '<td>' + (user.mobile || '---') + '</td>' +
                                  '<td>' + (user.address || '---') + '</td>' +
                                  '<td class="' + statusClass + '">' + statusText + '</td>' +
                                  '<td>' +
                                      '<button class="btn-action edit-btn" onclick="editUser(\'' + user._id + '\', \'' + user.name + '\', \'' + (user.mobile || '') + '\', \'' + (user.address || '') + '\')"><i class="fa-solid fa-pen"></i></button>' +
                                      '<button class="btn-action delete-btn" onclick="deleteUser(\'' + user._id + '\')"><i class="fa-solid fa-trash"></i></button>' +
                                  '</td>';
                    tableBody.appendChild(row);
                });
            } catch (err) {
                Swal.fire('Error', 'Data load nahi ho paya', 'error');
            }
        }

        // 3. DELETE USER
        async function deleteUser(id) {
            const result = await Swal.fire({
                title: 'Kya aap sure hain?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4d4d',
                confirmButtonText: 'Haan, Delete kar do!',
                background: '#0f1326', color: '#fff'
            });

            if (result.isConfirmed) {
                await fetch('/api/admin/delete-user/' + id, { 
                    method: 'DELETE',
                    headers: { 'admin-key': validAdminKey } 
                });
                Swal.fire({icon: 'success', title: 'Deleted!', text: 'User remove ho gaya.', background: '#0f1326', color: '#fff'});
                fetchUsers();
            }
        }

        // 4. EDIT USER
        async function editUser(id, oldName, oldMobile, oldAddress) {
            const result = await Swal.fire({
                title: 'Edit User Details',
                html:
                    '<input id="swal-name" class="swal2-input" value="' + oldName + '">' +
                    '<input id="swal-mobile" class="swal2-input" value="' + oldMobile + '" placeholder="Mobile">' +
                    '<input id="swal-address" class="swal2-input" value="' + oldAddress + '" placeholder="Address">',
                background: '#0f1326', color: '#fff',
                preConfirm: function() {
                    return {
                        name: document.getElementById('swal-name').value,
                        mobile: document.getElementById('swal-mobile').value,
                        address: document.getElementById('swal-address').value
                    }
                }
            });

            if (result.value) {
                await fetch('/api/admin/edit-user/' + id, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'admin-key': validAdminKey 
                    },
                    body: JSON.stringify(result.value)
                });
                Swal.fire({icon: 'success', title: 'Updated!', text: 'Data update ho gaya.', background: '#0f1326', color: '#fff'});
                fetchUsers();
            }
        }

        // EXPORT TO EXCEL
        function exportToExcel() {
            const table = document.getElementById("admin-table");
            const workbook = XLSX.utils.table_to_book(table);
            XLSX.writeFile(workbook, "Star_Emitra_Customers.xlsx");
        }

        // START
        window.onload = checkAccess;
    </script>
</body>
</html>
